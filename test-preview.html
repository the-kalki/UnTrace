<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bulk Reddit Nuke - Side Panel Preview</title>
  <style>
    body {
      background: #050608;
      color: #E6EDF3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .preview-container {
      width: 400px;
      height: 700px;
      border: 1px solid #242B3A;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .preview-info {
      text-align: center;
      max-width: 400px;
      font-size: 13px;
      color: #94A3B8;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #1B202C;
      color: #00D2FF;
      border-radius: 4px;
      font-weight: 600;
      font-size: 11px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="badge">CHROME SIDE PANEL PREVIEW (400px VIEWPORT)</div>
  <div class="preview-container">
    <iframe src="src/sidepanel/sidepanel.html"></iframe>
  </div>
  <div class="preview-info">
    To test the full Chrome Extension directly in Google Chrome:
    <br>
    Navigate to <code>chrome://extensions</code>, enable <strong>Developer mode</strong>, and click <strong>Load unpacked</strong> selecting this directory.
  </div>
</body>
</html>
